services:
  # API Service
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
    container_name: ${API_CONTAINER_NAME}
    ports:
      - "${API_PORT}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - DOTNET_RUNNING_IN_CONTAINER=true
    networks:
      - h2-network

  # Bruno API Tests
  bruno-tests:
    image: node:20-alpine
    container_name: h2-bruno-tests-mags25
    working_dir: /app
    volumes:
      - ./Bruno:/app/Bruno
      - ./test-results:/app/test-results
    environment:
      - NODE_ENV=production
    command: >
      sh -c "
        echo '🚀 Installing Bruno CLI...' &&
        npm install -g @usebruno/cli &&
        echo '⏳ Waiting for API to be ready...' &&
        sleep 30 &&
        echo '🧪 Running Bruno API Tests...' &&
        cd Bruno/API &&
        npx @usebruno/cli run --env KAbdiKhan --output /app/test-results/test-report-$$(date +%Y-%m-%d_%H-%M-%S).html --format html &&
        npx @usebruno/cli run --env KAbdiKhan --output /app/test-results/test-results-$$(date +%Y-%m-%d_%H-%M-%S).json --format json &&
        echo '✅ Tests completed! Results saved to test-results/ folder' &&
        echo '📊 Test Summary:' &&
        ls -la /app/test-results/
      "
    depends_on:
      - api
    networks:
      - h2-network
    restart: "no"


networks:
  h2-network:
    driver: bridge
