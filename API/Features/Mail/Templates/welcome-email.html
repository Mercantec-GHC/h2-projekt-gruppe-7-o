<!DOCTYPE html>

<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velkommen til KabdiKhan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6f9fc;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }

        .header {
            background-color: #007bff;
            color: #ffffff;
            padding: 15px;
            text-align: center;
        }

            .header h1 {
                margin: 0;
                font-size: 24px;
            }

        .content {
            padding: 20px;
            line-height: 1.6;
            color: #333333;
        }

            .content h2 {
                margin-top: 0;
            }

        .button-container {
            text-align: center;
            padding: 20px 0;
        }

        .button {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #666666;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Velkommen til KabdiKhan!</h1>
        </div>
        <div class="content">
            <p>Hej {username},</p>
            <p>Din konto er nu oprettet, og du er klar til at logge ind og udforske systemet.</p>
            <div class="button-container">
                <a href="https://kabdikhan.mercantec.tech" class="button">
                    Log ind på systemet
                </a>
            </div>
            <p>Venlig hilsen,<br>Kabdikhan</p>
        </div>
        <div class="footer">
            <p>&copy; 2025 KabdiKhan Alle rettigheder forbeholdes.</p>
        </div>
    </div>
</body>
</html>
